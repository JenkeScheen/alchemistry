<link rel="shortcut icon" type="image/png" href="assets/favicon.png">

<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v={{ site.time | date: '%s' }}">

{%- comment -%}
Link previews on LinkedIn, Bluesky, Slack and similar. Without an image here, LinkedIn
picks the first photo it finds on the page; set `image:` in a page's front matter to choose it
(ideally 1200×630).
{%- endcomment %}
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.summary | default: page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{%- if page.image %}
<meta property="og:image" content="{{ page.image | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
{%- endif %}
