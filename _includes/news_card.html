<a class="news-card" href="{{ include.post.url | relative_url }}">
    <div class="news-meta">
        <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %-d, %Y" }}</time>
        {%- if include.post.tag %}<span class="news-tag">{{ include.post.tag }}</span>{% endif %}
    </div>
    <h3 class="news-title">{{ include.post.title }}</h3>
    <p class="news-summary">{{ include.post.summary | default: include.post.excerpt | strip_html | strip | truncatewords: 32 }}</p>
    <span class="news-more">Read more <i class="fas fa-arrow-right" aria-hidden="true"></i></span>
</a>
